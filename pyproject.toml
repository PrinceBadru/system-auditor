[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "system-auditor"
version = "0.1.0"
description = "A tool for examining systems and infrastructure and communicating useful findings."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "PrinceBadru" }]

[project.optional-dependencies]
dev = ["ruff>=0.11.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"
